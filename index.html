<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Grand RP DC Checker — POV · OCR · YouTube · ACP · Drive Backup. Kostenloses lokales Admin-/Moderationswerkzeug." />
    <title>Grand RP DC Checker — POV · OCR · YouTube</title>
    <style>
      html, body { margin: 0; padding: 0; background: #070b14; }
      #dc-global-error {
        display: none;
        position: fixed; inset: auto 0 0 0; z-index: 999999;
        background: #7f1d1d; color: #fee2e2; padding: 12px 16px;
        font: 600 12px/1.5 ui-monospace, monospace;
        border-top: 2px solid #ef4444;
      }
      #dc-boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 14px; color: #94a3b8;
        font: 500 13px system-ui, sans-serif;
      }
      #dc-boot .ring {
        width: 42px; height: 42px; border-radius: 50%;
        border: 4px solid rgba(245, 158, 11, .25); border-top-color: #f59e0b;
        animation: dcspin .9s linear infinite;
      }
      @keyframes dcspin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="dc-boot">
        <div class="ring"></div>
        <div>Grand RP DC Checker wird geladen …</div>
      </div>
    </div>
    <div id="dc-global-error"></div>
    <script>
      // Fängt Fehler ab, bevor React überhaupt startet – damit nie eine
      // schwarze Seite ohne Hinweis stehen bleibt.
      (function () {
        function show(msg) {
          try {
            var el = document.getElementById("dc-global-error");
            if (!el) return;
            el.style.display = "flex";
            el.textContent = "FEHLER: " + msg;
          } catch (e) {}
        }
        window.addEventListener("error", function (ev) {
          show((ev.message || "Unbekannter Fehler") + (ev.filename ? "  (" + ev.filename.split("/").pop() + ":" + ev.lineno + ")" : ""));
        });
        window.addEventListener("unhandledrejection", function (ev) {
          var r = ev.reason;
          show("Promise: " + (r && r.message ? r.message : String(r)));
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
